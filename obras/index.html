<script>

    ['mo', 'Mão de obra', 'Custos Variáveis', 'Serviços terceirizados'],

    ['equip', 'Equipamentos e apoio', 'Custos Variáveis', 'Insumos'],
    ['desl', 'Deslocamento e alimentação', 'Deslocamentos Serviços', 'Deslocamentos'],

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function hoje() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }

  function num(v) { if (typeof v === 'number') return isFinite(v) ? v : 0; var s = String(v == null ? '' : v).trim(); if (!s) return 0; if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.'); var n = parseFloat(s); return isFinite(n) ? n : 0; }

  function pct(v, d) { return (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }) + '%'; }
  function numCampo(v) { return v == null || v === '' ? '' : String(v).replace('.', ','); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function toast(m) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 3500); }

  function textoDias(n) { return plural(n, 'dia', 'dias'); }

  // ===================== BANCO =====================
  var banco = null, modoDemo = /[?&]demo=1/.test(location.search), usuario = '', dono = false;

  function bancoFirestore(db) {
    function lista(snap) { return snap.docs.map(function (d) { var x = d.data() || {}; x.id = d.id; return x; }); }
    return {
      ouvir: function (col, filtro, cb, erro) {
        var q = db.collection(col);
        if (filtro) q = q.where(filtro[0], filtro[1], filtro[2]);
        return q.onSnapshot(function (s) { cb(lista(s)); }, function (e) { console.error(col, e); if (erro) erro(e); else toast('Erro ao ler ' + col + ': ' + e.message); });
      },
      ouvirDoc: function (col, id, cb, erro) {
        return db.collection(col).doc(id).onSnapshot(function (d) { cb(d.exists ? Object.assign({ id: d.id }, d.data()) : null); }, function (e) { console.error(col, e); if (erro) erro(e); });
      },
      buscar: function (col, filtro) { return db.collection(col).where(filtro[0], filtro[1], filtro[2]).get().then(lista); },
      todos: function (col) { return db.collection(col).get().then(lista); },
      ler: function (col, id) { return db.collection(col).doc(id).get().then(function (d) { return d.exists ? Object.assign({ id: d.id }, d.data()) : null; }); },
      // merge: true não apaga os campos gravados pelo Finanças e pelos outros sistemas
      atualizar: function (col, id, doc) { return db.collection(col).doc(id).set(doc, { merge: true }); },
      gravar: function (col, id, doc) { return db.collection(col).doc(id).set(doc); },
      criar: function (col, doc) { return db.collection(col).add(doc).then(function (r) { return r.id; }); },
      excluir: function (col, id) { return db.collection(col).doc(id).delete(); },
      apagarCampo: function (col, id, campo) { var u = {}; u[campo] = firebase.firestore.FieldValue.delete(); return db.collection(col).doc(id).update(u).catch(function () {}); }
    };
  }

  // Modo de teste: tudo no navegador, com uma obra de exemplo
  function bancoLocal() {
    var CH = 'obras-demo-v1', ouvintes = [], dados;
    try { dados = JSON.parse(localStorage.getItem(CH) || 'null'); } catch (e) { dados = null; }
    if (!dados) dados = exemplo();
    function salvar() { try { localStorage.setItem(CH, JSON.stringify(dados)); } catch (e) { toast('Armazenamento do navegador cheio (fotos).'); } }
    function col(c) { return (dados[c] = dados[c] || []); }
    function casa(x, f) { if (!f) return true; var v = f[0].split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, x); return f[1] === '==' ? v === f[2] : true; }
    function copia(x) { return JSON.parse(JSON.stringify(x)); }
    function avisar() { ouvintes.forEach(function (o) { if (o.doc) { var x = col(o.col).find(function (y) { return y.id === o.doc; }); o.cb(x ? copia(x) : null); } else o.cb(col(o.col).filter(function (x) { return casa(x, o.f); }).map(copia)); }); }
    function mesclar(a, b) { Object.keys(b).forEach(function (k) { var v = b[k]; if (v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) mesclar(a[k], v); else a[k] = copia(v); }); return a; }
    return {
      ouvir: function (c, f, cb) { var o = { col: c, f: f, cb: cb }; ouvintes.push(o); setTimeout(function () { if (ouvintes.indexOf(o) >= 0) cb(col(c).filter(function (x) { return casa(x, f); }).map(copia)); }, 0); return function () { ouvintes = ouvintes.filter(function (y) { return y !== o; }); }; },
      ouvirDoc: function (c, id, cb) { var o = { col: c, doc: id, cb: cb }; ouvintes.push(o); setTimeout(avisar, 0); return function () { ouvintes = ouvintes.filter(function (y) { return y !== o; }); }; },
      todos: function (c) { return Promise.resolve(col(c).map(copia)); },
      buscar: function (c, f) { return Promise.resolve(col(c).filter(function (x) { return casa(x, f); }).map(copia)); },
      ler: function (c, id) { var x = col(c).find(function (y) { return y.id === id; }); return Promise.resolve(x ? copia(x) : null); },
      atualizar: function (c, id, doc) { var x = col(c).find(function (y) { return y.id === id; }); if (x) mesclar(x, doc); else col(c).push(mesclar({ id: id }, doc)); salvar(); avisar(); return Promise.resolve(); },
      gravar: function (c, id, doc) { dados[c] = col(c).filter(function (y) { return y.id !== id; }); dados[c].push(Object.assign({ id: id }, copia(doc))); salvar(); avisar(); return Promise.resolve(); },

      encadear(etapas, ini);

        equipePrevista: (os.obra && os.obra.equipe) || '', etapas: etapas, status: $('i-st').value, portal: true, historico: [], criadoEm: agora(), criadoPor: usuario, atualizadoEm: agora() };
      this.disabled = true;

      if (dono) {

  // Custos previstos a partir da memória de cálculo da proposta (sem BDI, impostos e lucro)
  async function orcadoDaProposta(os) {
    if (!os.propostaId) return null;
    var p = await banco.ler('propostas', os.propostaId);
    var c = p && p.calculo; if (!c) return null;
    var t = function (s, f) { return (c[s] || []).reduce(function (a, r) { return a + f(r); }, 0); };
    var fES = 1 + num(c.encSoc) / 100;
    var moR = t('mo', function (r) { return r.t === 'R' ? num(r.q) * num(r.h) * num(r.v) : 0; });
    var moD = t('mo', function (r) { return r.t !== 'R' ? num(r.q) * num(r.h) * num(r.v) : 0; });
    var horasD = t('mo', function (r) { return r.t !== 'R' ? num(r.q) * num(r.h) : 0; });
    var r2 = function (v) { return Math.round(v * 100) / 100; };
    return {
      mo: r2(moR * fES + moD + horasD * num(c.encD) * (fES - 1)),
      mat: r2(t('mat', function (r) { return num(r.q) * num(r.v) * (1 + num(r.i) / 100); })),
      equip: r2(t('apoio', function (r) { return num(r.q) * num(r.v) * (1 + num(r.i) / 100); })),
      desl: r2(t('desp', function (r) { return num(r.q) * num(r.u) * num(r.v); })),
      coord: r2(t('coord', function (r) { return num(r.q) * num(r.h) * num(r.v); })),
      outros: 0, origem: 'proposta'
    };
  }

  // Resumo da obra na OS (contrato de integração do Finanças: resultados[<sistema>], sempre com merge)
  function gravarResultadoOS(ob, extra) {
    var r = {}; r[NOME_SISTEMA] = { avanco: Math.round(avancoGeral(ob)), status: ob.status, rdos: atual.rdos.length, inicio: inicioObra(ob), previsaoFim: fimObra(ob), resumo: 'Avanço físico ' + pct(avancoGeral(ob)) + ' · ' + STATUS[ob.status || 'andamento'][0], link: location.origin + '/obras/?obra=' + ob.id, atualizadoEm: agora() };
    var doc = Object.assign({ resultados: r, servicos: { civil: true } }, extra || {});
    return banco.atualizar('ordens', ob.id, doc).catch(function (e) { console.warn('OS', e); });
  }

  // ---------- Resumo ----------
  function abaResumo(a, ob, os) {
    var av = avancoGeral(ob), prev = previstoEm(ob, hoje()), ini = inicioObra(ob), fim = fimObra(ob);

      '<div class="grade" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">' +

      '<div class="card" style="margin:0"><h2>Dados da obra</h2>' +
      '<label>Situação</label><select id="r-status">' + Object.keys(STATUS).map(function (k) { return '<option value="' + k + '"' + (ob.status === k ? ' selected' : '') + '>' + STATUS[k][0] + '</option>'; }).join('') + '</select>' +
      (end ? '<label>Local</label><div>' + esc(end) + '</div>' : '') +
      (ob.equipePrevista ? '<label>Equipe prevista na proposta</label><div>' + esc(ob.equipePrevista) + '</div>' : '') +
      '<label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" id="r-portal" style="width:auto"' + (ob.portal ? ' checked' : '') + '> Cliente acompanha pelo Portal do Cliente</label>' +
      '<div class="muted">' + (ob.portal ? 'O cliente vê o avanço, o cronograma e os RDOs marcados para ele.' + (ob.portalEm ? ' Atualizado em ' + dt(ob.portalEm) + '.' : '') : 'Desligado: o cliente não vê esta obra.') + '</div>' +
      '<div class="acoes"><button class="btn sec peq" id="r-pub">Atualizar portal agora</button></div></div></div>';
    var bd = $('r-diario'); if (bd) bd.onclick = function () { tela.aba = 'diario'; render(); };

    $('r-status').onchange = async function () {

      if (st === 'andamento' && os && (os.status || 'aberta') === 'aberta') extra = { status: 'execucao' };
      await salvar(function () { return banco.atualizar('obras', ob.id, { status: st, atualizadoEm: agora() }); }, 'Situação salva.');

    };
    $('r-portal').onchange = async function () {

      await salvar(function () { return banco.atualizar('obras', ob.id, { portal: on, atualizadoEm: agora() }); }, on ? 'O cliente passa a ver esta obra no portal.' : 'Obra retirada do portal.');

    };
    $('r-pub').onclick = function () { if (!ob.portal) { toast('Ligue "Cliente acompanha pelo Portal" primeiro.'); return; } publicarPortal(ob, true); };

  function linhaEtapaResumo(e) {
    var s = situacaoEtapa(e);
    return '<div style="padding:6px 0;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px">' + esc(e.nome) + '</b><span class="chip ' + s[1] + '">' + s[0] + '</span></div>' +
      '<div style="display:flex;gap:8px;align-items:center;margin-top:4px"><div class="barra" style="flex:1"><div style="width:' + clamp(num(e.avanco), 0, 100) + '%"></div></div><span style="font-size:12px;width:38px;text-align:right">' + pct(e.avanco) + '</span></div>' +
      '<div class="muted">' + dt(e.inicio) + ' → ' + dt(fimEtapa(e)) + '</div></div>';
  }
  function totalEquipe(r) { return (r.equipe || []).reduce(function (s, x) { return s + num(x.qtd); }, 0); }

  function curvaS(ob) {
    var ini = inicioObra(ob), fim = fimObra(ob), n = Math.max(1, difDias(ini, fim) + 1);
    var W = 720, H = 220, L = 38, R = 12, T = 12, B = 26, w = W - L - R, h = H - T - B;
    var X = function (iso) { return L + clamp(difDias(ini, iso) / n, 0, 1.08) * w; }, Y = function (p) { return T + h - clamp(p, 0, 100) / 100 * h; };
    var passo = Math.max(1, Math.ceil(n / 60)), pts = [];
    for (var i = 0; i <= n; i += passo) { var d = somarDias(ini, i); pts.push(X(d).toFixed(1) + ',' + Y(previstoEm(ob, somarDias(d, -1))).toFixed(1)); }
    pts.push(X(somarDias(fim, 1)).toFixed(1) + ',' + Y(100).toFixed(1));
    var hist = (ob.historico || []).filter(function (x) { return x.data >= ini; });
    var real = [X(ini).toFixed(1) + ',' + Y(0)].concat(hist.map(function (x) { return X(x.data).toFixed(1) + ',' + Y(x.avanco).toFixed(1); }));
    var grade = [0, 25, 50, 75, 100].map(function (p) { return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(p) + '" y2="' + Y(p) + '" stroke="currentColor" stroke-opacity=".12"/><text x="' + (L - 6) + '" y="' + (Y(p) + 4) + '" text-anchor="end" font-size="10" fill="currentColor" fill-opacity=".6">' + p + '%</text>'; }).join('');
    var marcas = [], nm = Math.min(6, n); for (var k = 0; k <= nm; k++) { var dd = somarDias(ini, Math.round(k * (n - 1) / Math.max(1, nm))); marcas.push('<text x="' + X(dd) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity=".6">' + dtc(dd) + '</text>'); }
    var hx = X(hoje());
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Curva de avanço previsto e realizado" style="color:var(--text)">' + grade + marcas.join('') +
      (hoje() >= ini && hoje() <= somarDias(fim, Math.round(n * .08)) ? '<line x1="' + hx + '" x2="' + hx + '" y1="' + T + '" y2="' + (T + h) + '" stroke="var(--bad)" stroke-dasharray="3 3" stroke-opacity=".7"/><text x="' + (hx + 3) + '" y="' + (T + 10) + '" font-size="10" fill="var(--bad)">hoje</text>' : '') +
      '<polyline fill="none" stroke="var(--prev)" stroke-width="2.5" points="' + pts.join(' ') + '"/>' +
      '<polyline fill="none" stroke="var(--real)" stroke-width="3" points="' + real.join(' ') + '"/>' +
      hist.map(function (x) { return '<circle cx="' + X(x.data).toFixed(1) + '" cy="' + Y(x.avanco).toFixed(1) + '" r="3" fill="var(--real)"><title>' + dt(x.data) + ': ' + pct(x.avanco, 1) + '</title></circle>'; }).join('') + '</svg>';
  }

  // ---------- Cronograma (Gantt) ----------
  function abaCronograma(a, ob) {
    var es = ob.etapas || [];
    a.innerHTML = '<div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center"><h2 style="margin:0">Cronograma</h2>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn peq" id="c-nova">+ Etapa</button><button class="btn sec peq" id="c-encadear" title="Cada etapa começa no dia seguinte ao fim da anterior">Encadear datas</button><button class="btn sec peq" id="c-pdf">Imprimir</button></div></div>' +
      '<p class="muted">Clique numa etapa para editar datas, dias, peso e avanço. O avanço também é atualizado pelos diários de obra.</p>' +
      gantt(ob) + '<div class="legenda"><span><i style="background:var(--prev)"></i>Previsto</span><span><i style="background:var(--real)"></i>Realizado</span><span><i style="background:var(--bad)"></i>Hoje</span></div></div>' +
      '<div class="card tabela"><table><thead><tr><th>Etapa</th><th>Início</th><th>Fim</th><th class="num">Dias</th><th class="num">Peso</th><th class="num">Avanço</th><th>Situação</th></tr></thead><tbody>' +
      es.map(function (e) { var s = situacaoEtapa(e); return '<tr data-et="' + e.id + '" style="cursor:pointer"><td><b>' + esc(e.nome) + '</b><div class="muted">' + esc(e.atividade || '') + '</div></td><td>' + dt(e.inicio) + (e.inicioReal ? '<div class="muted">real ' + dt(e.inicioReal) + '</div>' : '') + '</td><td>' + dt(fimEtapa(e)) + (e.fimReal ? '<div class="muted">real ' + dt(e.fimReal) + '</div>' : '') + '</td><td class="num">' + num(e.dias) + '</td><td class="num">' + pct(peso(e) / es.reduce(function (t, x) { return t + peso(x); }, 0) * 100, 1) + '</td><td class="num"><b>' + pct(e.avanco) + '</b></td><td><span class="chip ' + s[1] + '">' + s[0] + '</span></td></tr>'; }).join('') +
      '</tbody></table></div>';
    a.querySelectorAll('[data-et]').forEach(function (r) { r.onclick = function () { formEtapa(ob, r.dataset.et); }; });
    $('c-nova').onclick = function () { formEtapa(ob, ''); };
    $('c-encadear').onclick = async function () {
      if (!confirm('Refazer as datas previstas em sequência, a partir de ' + dt(inicioObra(ob)) + '?')) return;
      var et = JSON.parse(JSON.stringify(ob.etapas || [])); encadear(et, inicioObra(ob));
      await salvar(function () { return banco.atualizar('obras', ob.id, { etapas: et, atualizadoEm: agora() }); }, 'Datas encadeadas.');
      ob.etapas = et; depoisDeMudar(ob);
    };
    $('c-pdf').onclick = function () { imprimirCronograma(ob); };
  }
  function gantt(ob) {
    var es = ob.etapas || [];
    if (!es.length) return '<div class="vazio">Sem etapas.</div>';
    var ini = inicioObra(ob), fim = fimObra(ob);
    es.forEach(function (e) { if (e.fimReal && e.fimReal > fim) fim = e.fimReal; if (e.inicioReal && e.inicioReal < ini) ini = e.inicioReal; });
    if (hoje() > fim && es.some(function (e) { return num(e.avanco) < 100; })) fim = hoje();
    var n = difDias(ini, fim) + 1, P = function (iso) { return clamp(difDias(ini, iso) / n * 100, 0, 100); };
    var nt = Math.min(10, n), ticks = '';
    for (var k = 0; k < nt; k++) { var d = somarDias(ini, Math.round(k * n / nt)); ticks += '<span class="g-tick" style="left:' + P(d).toFixed(2) + '%">' + dtc(d) + '</span>'; }
    var hj = hoje() >= ini && hoje() <= fim ? '<div class="g-hoje" style="left:' + P(hoje()).toFixed(2) + '%"></div>' : '';
    return '<div class="gantt"><div class="g-wrap"><div class="g-row cab"><div></div><div class="g-track" style="height:22px">' + ticks + '</div></div>' +
      es.map(function (e) {
        var l = P(e.inicio), w = Math.max(.6, P(somarDias(fimEtapa(e), 1)) - l), real = '', fimBarra = l + w;
        if (num(e.avanco) > 0) {
          var ri = e.inicioReal || e.inicio, rf = num(e.avanco) >= 100 ? (e.fimReal || fimEtapa(e)) : hoje();
          if (rf < ri) rf = ri;
          var rl = P(ri), rw = Math.max(.6, P(somarDias(rf, 1)) - rl);
          real = '<div class="g-bar real" style="left:' + rl.toFixed(2) + '%;width:' + rw.toFixed(2) + '%"></div>';
          fimBarra = Math.max(fimBarra, rl + rw);
        }
        return '<div class="g-row"><div class="g-nome" data-et="' + e.id + '"><b>' + esc(e.nome) + '</b><span class="muted">' + dtc(e.inicio) + ' – ' + dtc(fimEtapa(e)) + ' · ' + pct(e.avanco) + '</span></div><div class="g-track">' + hj +
          '<div class="g-bar prev" style="left:' + l.toFixed(2) + '%;width:' + w.toFixed(2) + '%" title="Previsto: ' + dt(e.inicio) + ' a ' + dt(fimEtapa(e)) + '"></div>' + real +
          '<span class="g-pct" style="left:' + Math.min(92, fimBarra).toFixed(2) + '%">' + (num(e.avanco) ? pct(e.avanco) : '') + '</span></div></div>';
      }).join('') + '</div></div>';
  }
  function formEtapa(ob, etId) {
    var es = JSON.parse(JSON.stringify(ob.etapas || [])), i = es.findIndex(function (x) { return x.id === etId; });
    var e = i >= 0 ? es[i] : { id: uid(), nome: '', atividade: '', inicio: es.length ? somarDias(fimEtapa(es[es.length - 1]), 1) : hoje(), dias: 5, avanco: 0 };
    abrirModal('<h3>' + (i >= 0 ? 'Editar etapa' : 'Nova etapa') + '</h3>' +
      '<label>Etapa *</label><input id="e-nome" value="' + esc(e.nome) + '">' +
      '<label>Atividade / descrição</label><input id="e-ativ" value="' + esc(e.atividade) + '">' +
      '<div class="linha"><div><label>Início previsto</label><input type="date" id="e-ini" value="' + esc(e.inicio) + '"></div><div><label>Dias previstos</label><input id="e-dias" inputmode="numeric" value="' + num(e.dias) + '"></div>' +
      '<div><label title="Quanto a etapa pesa no avanço da obra. Vazio = proporcional aos dias">Peso (vazio = dias)</label><input id="e-peso" inputmode="decimal" value="' + esc(numCampo(e.peso)) + '"></div></div>' +
      '<label>Avanço: <b id="e-avt">' + pct(e.avanco) + '</b></label><input type="range" id="e-av" min="0" max="100" step="5" value="' + clamp(num(e.avanco), 0, 100) + '">' +
      '<div class="linha"><div><label>Início real</label><input type="date" id="e-ir" value="' + esc(e.inicioReal || '') + '"></div><div><label>Fim real</label><input type="date" id="e-fr" value="' + esc(e.fimReal || '') + '"></div></div>' +
      '<div class="acoes"><button class="btn" id="e-ok">Salvar</button>' + (i >= 0 ? '<button class="btn sec" id="e-cima">↑</button><button class="btn sec" id="e-baixo">↓</button><button class="btn perigo" id="e-exc">Excluir</button>' : '') + '<button class="btn sec" id="e-can">Cancelar</button></div>');
    $('e-av').oninput = function () { $('e-avt').textContent = pct(this.value); };
    $('e-can').onclick = fecharModal;
    async function gravar(lista, msg) {
      await salvar(function () { return banco.atualizar('obras', ob.id, { etapas: lista, atualizadoEm: agora() }); }, msg);
      ob.etapas = lista; registrarHistorico(ob, hoje()); banco.atualizar('obras', ob.id, { historico: ob.historico }); fecharModal(); depoisDeMudar(ob);

  // ===================== PORTAL DO CLIENTE =====================
  // portal_obras/<empresaId>.obras.<obraId>: avanço, cronograma e os RDOs marcados para o cliente (sem custos nem valores).
  // As fotos desses RDOs são copiadas para portal_obras_fotos/<fotoId> (com empresaId), que o cliente lê enquanto o contrato vale.
  var timerPortal = 0;
  function agendarPortal(ob) { clearTimeout(timerPortal); timerPortal = setTimeout(function () { publicarPortal(obraDe(ob.id) || ob); }, 2500); }
  async function publicarPortal(ob, avisar) {
    if (!ob.empresaId) { if (avisar) toast('A OS desta obra não tem cliente ligado.'); return; }
    try {
      var rdos = (await banco.buscar('obras_rdo', ['obraId', '==', ob.id])).filter(function (r) { return r.cliente !== false; }).sort(function (a, b) { return b.numero - a.numero; });
      var publicadas = ob.portalFotos || [], fotosAgora = [];
      for (var i = 0; i < rdos.length; i++) {
        for (var j = 0; j < (rdos[i].fotos || []).length; j++) {
          var f = rdos[i].fotos[j]; fotosAgora.push(f.id);
          if (publicadas.indexOf(f.id) >= 0) continue;
          var full = await banco.ler('obras_fotos', f.id);
          if (full) await banco.gravar('portal_obras_fotos', f.id, { empresaId: ob.empresaId, obraId: ob.id, dataUrl: full.dataUrl, legenda: f.legenda || '', criadoEm: agora() });
        }
      }
      for (var k = 0; k < publicadas.length; k++) if (fotosAgora.indexOf(publicadas[k]) < 0) await banco.excluir('portal_obras_fotos', publicadas[k]).catch(function () {});
      var item = {
        titulo: ob.titulo || '', os: ob.osCodigo || '', status: ob.status || 'andamento', situacao: situacaoObra(ob)[0], area: ob.area || '', unidade: ob.unidade || '',
        avanco: Math.round(avancoGeral(ob) * 10) / 10, previsto: Math.round(previstoEm(ob, hoje()) * 10) / 10, inicio: inicioObra(ob), previsaoFim: fimObra(ob),
        etapas: (ob.etapas || []).map(function (e) { return { nome: e.nome, inicio: e.inicio, fim: fimEtapa(e), avanco: num(e.avanco), inicioReal: e.inicioReal || '', fimReal: e.fimReal || '' }; }),
        historico: (ob.historico || []).slice(-120),
        rdos: rdos.slice(0, 120).map(function (r) { return { numero: r.numero, data: r.data, climaManha: r.climaManha || '', climaTarde: r.climaTarde || '', praticavel: r.praticavel !== false, equipe: totalEquipe(r), atividades: r.atividades || '', ocorrencias: r.ocorrencias || '', fotos: (r.fotos || []).map(function (f) { return { id: f.id, thumb: f.thumb, legenda: f.legenda || '' }; }) }; }),
        atualizadoEm: agora()
      };
      var doc = { obras: {}, atualizadoEm: agora() }; doc.obras[ob.id] = item;
      await banco.atualizar('portal_obras', ob.empresaId, doc);
      await banco.atualizar('obras', ob.id, { portalFotos: fotosAgora, portalEm: agora() });
      if (avisar) toast('Portal do cliente atualizado.');
    } catch (e) { console.error(e); if (avisar) toast(e.code === 'permission-denied' ? 'Sem permissão para publicar no portal. As regras do banco precisam ser atualizadas.' : 'Não foi possível atualizar o portal: ' + (e.message || e)); }
  }
  async function tirarDoPortal(ob) {
    try {
      await banco.apagarCampo('portal_obras', ob.empresaId, 'obras.' + ob.id);
      var pf = ob.portalFotos || []; for (var i = 0; i < pf.length; i++) await banco.excluir('portal_obras_fotos', pf[i]).catch(function () {});
      await banco.atualizar('obras', ob.id, { portalFotos: [] });
    } catch (e) { console.error(e); }
  }

      '@page{size:A4;margin:14mm}body{font-family:Arial,Helvetica,sans-serif;color:#1d2433;font-size:12px;margin:0}' +
      '.cab{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #c2410c;padding-bottom:8px;margin-bottom:12px}.cab img{height:44px}.cab h1{font-size:17px;margin:0;text-align:right}.cab div{font-size:11px;color:#667085;text-align:right}' +
      'table{width:100%;border-collapse:collapse;margin:6px 0 12px}th,td{border:1px solid #cfd5df;padding:5px 6px;text-align:left;vertical-align:top}th{background:#f4f6f9;font-size:11px}' +
      'h2{font-size:13px;background:#fff1e6;color:#9a3412;padding:5px 8px;margin:14px 0 6px;border-left:4px solid #c2410c}.num{text-align:right}.fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fotos figure{margin:0;break-inside:avoid}.fotos img{width:100%;height:230px;object-fit:cover;border:1px solid #cfd5df}.fotos figcaption{font-size:11px;color:#667085;margin-top:3px}' +
      '.ass{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:46px}.ass div{border-top:1px solid #1d2433;padding-top:4px;text-align:center;font-size:11px}.pre{white-space:pre-line}.rod{margin-top:18px;font-size:10px;color:#667085;text-align:center}' +
      '.bar{height:8px;background:#eef0f4;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#ea7a1c}</style></head><body>' + corpo +
      '<div class="rod">IDEALLE Inspeções e Serviços · CREA-SP · documento gerado pelo sistema Gestão de Obra em ' + dt(hoje()) + '</div>' +
      '<script>window.onload=function(){setTimeout(function(){window.print()},400)}<\/script></body></html>');
    w.document.close();
  }
  function cabecalho(titulo, ob) {
    return '<div class="cab"><img src="' + location.origin + '/portal/logo-idealle.jpg" alt="IDEALLE"><div><h1>' + esc(titulo) + '</h1><div>' + esc(ob.titulo || '') + '<br>' + esc(ob.empresaNome || '') + ' · OS ' + esc(ob.osCodigo || '') + '</div></div></div>';
  }
  async function imprimirRdo(ob, r) {
    var fotos = [];
    for (var i = 0; i < (r.fotos || []).length; i++) { var f = await banco.ler('obras_fotos', r.fotos[i].id).catch(function () { return null; }); fotos.push({ src: f ? f.dataUrl : r.fotos[i].thumb, legenda: r.fotos[i].legenda || '' }); }
    var corpo = cabecalho('Relatório Diário de Obra · RDO nº ' + r.numero, ob) +
      '<table><tr><th>Data</th><td>' + dt(r.data) + '</td><th>Horário</th><td>' + esc(r.horaInicio || '') + ' às ' + esc(r.horaFim || '') + '</td></tr>' +
      '<tr><th>Clima manhã</th><td>' + esc(r.climaManha || '') + '</td><th>Clima tarde</th><td>' + esc(r.climaTarde || '') + '</td></tr>' +
      '<tr><th>Condição</th><td>' + (r.praticavel === false ? 'Impraticável' : 'Praticável') + '</td><th>Avanço da obra</th><td>' + pct(r.avancoGeral || 0, 1) + '</td></tr></table>' +
      '<h2>Equipe</h2><table><tr><th>Função</th><th class="num">Quantidade</th></tr>' + (r.equipe || []).map(function (x) { return '<tr><td>' + esc(x.funcao) + '</td><td class="num">' + num(x.qtd) + '</td></tr>'; }).join('') + '<tr><th>Total</th><th class="num">' + totalEquipe(r) + '</th></tr></table>' +
      '<h2>Atividades executadas</h2><div class="pre">' + esc(r.atividades || '—') + '</div>' +
      ((r.avancos || []).length ? '<h2>Avanço das etapas</h2><table><tr><th>Etapa</th><th class="num">Antes</th><th class="num">Depois</th></tr>' + r.avancos.map(function (x) { return '<tr><td>' + esc(x.nome) + '</td><td class="num">' + pct(x.de) + '</td><td class="num">' + pct(x.para) + '</td></tr>'; }).join('') + '</table>' : '') +
      (r.equipamentos ? '<h2>Equipamentos</h2><div class="pre">' + esc(r.equipamentos) + '</div>' : '') +
      '<h2>Ocorrências</h2><div class="pre">' + esc(r.ocorrencias || 'Sem ocorrências.') + '</div>' +
      (fotos.length ? '<h2>Registro fotográfico</h2><div class="fotos">' + fotos.map(function (f) { return '<figure><img src="' + f.src + '"><figcaption>' + esc(f.legenda) + '</figcaption></figure>'; }).join('') + '</div>' : '') +
      '<div class="ass"><div>Responsável IDEALLE</div><div>Fiscalização do cliente</div></div>';
    janelaImpressao('RDO ' + r.numero + ' - ' + (ob.osCodigo || ''), corpo);
  }
  function imprimirCronograma(ob) {
    var es = ob.etapas || [], ini = inicioObra(ob), fim = fimObra(ob), n = difDias(ini, fim) + 1;
    var P = function (iso) { return clamp(difDias(ini, iso) / n * 100, 0, 100); };
    var corpo = cabecalho('Cronograma físico da obra', ob) +
      '<table><tr><th>Início</th><td>' + dt(ini) + '</td><th>Término previsto</th><td>' + dt(fim) + '</td><th>Avanço</th><td>' + pct(avancoGeral(ob), 1) + ' (previsto ' + pct(previstoEm(ob, hoje()), 1) + ')</td></tr></table>' +
      '<table><tr><th>Etapa</th><th>Início</th><th>Fim</th><th class="num">Dias</th><th class="num">Avanço</th><th style="width:38%">Previsto (claro) × realizado</th></tr>' +
      es.map(function (e) { var l = P(e.inicio), w = Math.max(1, P(somarDias(fimEtapa(e), 1)) - l); return '<tr><td>' + esc(e.nome) + '</td><td>' + dt(e.inicio) + '</td><td>' + dt(fimEtapa(e)) + '</td><td class="num">' + num(e.dias) + '</td><td class="num">' + pct(e.avanco) + '</td><td><div style="position:relative;height:14px;background:#f4f6f9"><div style="position:absolute;left:' + l + '%;width:' + w + '%;top:0;height:14px;background:#f3c08f"></div><div style="position:absolute;left:' + l + '%;width:' + (w * clamp(num(e.avanco), 0, 100) / 100) + '%;top:4px;height:6px;background:#c2410c"></div></div></td></tr>'; }).join('') + '</table>';
    janelaImpressao('Cronograma ' + (ob.osCodigo || ''), corpo);
  }
  function imprimirMedicao(ob, m) {
    var ms = (fin().medicoes || []).slice().sort(function (x, y) { return x.numero - y.numero; }), ant = ms.filter(function (x) { return x.numero < m.numero; }).pop();
    var vc = valorContrato(ob), acum = ms.filter(function (x) { return x.numero <= m.numero; }).reduce(function (s, x) { return s + num(x.valor); }, 0);
    var antEt = (ant && ant.etapas) || [];
    var corpo = cabecalho('Boletim de Medição nº ' + m.numero, ob) +
      '<table><tr><th>Período</th><td>' + dt(m.inicio) + ' a ' + dt(m.fim) + '</td><th>Valor do contrato</th><td class="num">' + brl(vc) + '</td></tr>' +
      '<tr><th>Avanço anterior</th><td>' + pct(ant ? ant.acumulado : 0, 1) + '</td><th>Avanço acumulado</th><td class="num">' + pct(m.acumulado, 1) + '</td></tr></table>' +
      '<h2>Avanço físico por etapa</h2><table><tr><th>Etapa</th><th class="num">Peso</th><th class="num">Anterior</th><th class="num">Atual</th><th class="num">No período</th></tr>' +
      (m.etapas || []).map(function (e) { var a = antEt.find(function (x) { return x.nome === e.nome; }), av = a ? num(a.avanco) : 0; return '<tr><td>' + esc(e.nome) + '</td><td class="num">' + pct(e.peso, 1) + '</td><td class="num">' + pct(av) + '</td><td class="num">' + pct(e.avanco) + '</td><td class="num">' + pct(Math.max(0, num(e.avanco) - av)) + '</td></tr>'; }).join('') + '</table>' +
      '<h2>Valores</h2><table><tr><th>Medido neste boletim (' + pct(m.percentual, 1) + ')</th><td class="num"><b>' + brl(m.valor) + '</b></td></tr><tr><th>Acumulado medido</th><td class="num">' + brl(acum) + '</td></tr><tr><th>Saldo do contrato</th><td class="num">' + brl(vc - acum) + '</td></tr></table>' +
      (m.obs ? '<h2>Observações</h2><div class="pre">' + esc(m.obs) + '</div>' : '') +
      '<div class="ass"><div>IDEALLE Inspeções e Serviços</div><div>Aprovação do cliente</div></div>';
    janelaImpressao('Medicao ' + m.numero + ' - ' + (ob.osCodigo || ''), corpo);
  }
})();
</script>
</body>
</html>
