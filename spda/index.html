<style>
  /* Tema escuro do SPDA: azul-noite com destaque ciano (descarga elétrica) e amarelo-raio */
  :root {
    color-scheme: dark;
    --text: #e9ecf2; --muted: #9aa3b2;
    --pri: #2fd0e8; --pri-2: #0a2a31; --ok: #4cc38a; --ok-2: #13291f; --warn: #e3b04b; --warn-2: #2f2512;
    --bad: #f07a6f; --bad-2: #351817; --gray-2: #1a1f29; --azul: #a78bfa; --azul-2: #221a3a;
    --prev: #1f5560; --real: #2fd0e8; --raio: #f5d33f; --raio-2: #2e2708;
    --bg: #05080d; --card: #0e131b; --line: #1f2733;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }
  header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; max-width: 1200px; margin: 0 auto; gap: 12px; }
  .marca { font-weight: 700; font-size: 18px; letter-spacing: .3px; display: flex; align-items: center; gap: 10px; }
  .marca img { width: 32px; height: 32px; border-radius: 8px; }
  .marca small { font-weight: 400; color: var(--muted); font-size: 13px; }
  .usuario { color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 2px; } h2 { font-size: 17px; margin: 0 0 10px; } h3 { margin: 0 0 12px; font-size: 17px; }
  .muted { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .btn { background: var(--pri); color: #021418; border: 1px solid var(--pri); border-radius: 8px; padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; }
  .btn.sec { background: transparent; color: var(--text); border-color: var(--line); }
  .btn.ok { background: var(--ok); border-color: var(--ok); }
  .btn.perigo { background: transparent; color: var(--bad); border-color: var(--bad); }
  .btn.peq { padding: 5px 10px; font-size: 13px; min-height: 32px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); font-size: 15px; font-family: inherit; }
  textarea { min-height: 76px; resize: vertical; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
  .linha { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 12px; }

  .chip.ok { background: var(--ok-2); color: var(--ok); } .chip.warn { background: var(--warn-2); color: var(--warn); } .chip.bad { background: var(--bad-2); color: var(--bad); } .chip.pri { background: var(--pri-2); color: var(--pri); } .chip.azul { background: var(--azul-2); color: var(--azul); }
  .barra { height: 8px; border-radius: 999px; background: var(--gray-2); overflow: hidden; }

  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

  .hoje-bt:hover { border-color: var(--pri); } .hoje-bt:active { transform: scale(.98); }

  .hoje-tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; } .hoje-tx b { font-size: 15px; } .hoje-tx small { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 4px; }
  .hoje-bt.ok .hoje-ic { background: var(--ok-2); color: var(--ok); } .hoje-bt.ok small { color: var(--ok); }

  /* Gantt */
  .gantt { overflow-x: auto; }
  .g-wrap { min-width: 720px; }

  .g-row.cab { border-top: 0; min-height: 26px; font-size: 11px; color: var(--muted); }

  .eq-linha { display: grid; grid-template-columns: 1fr 80px 40px; gap: 6px; margin-bottom: 6px; }

  .av-linha input[type=range] { padding: 0; }

  .fundo { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: flex-start; justify-content: center; z-index: 50; overflow-y: auto; padding: 24px 12px; }
  .fundo.aberto { display: flex; }
  .modal { background: var(--card); border-radius: 12px; padding: 18px; width: 100%; max-width: 720px; border: 1px solid var(--line); }

  #tela-login { max-width: 400px; margin: 10vh auto; }
  .aviso { background: var(--warn-2); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
  .curva svg { width: 100%; height: auto; display: block; }
  .so-dono { }

    main { padding: 12px; }

  }

  .chip.azul { background: var(--azul-2); color: var(--azul); } .chip.bad { background: var(--bad-2); color: var(--bad); }
  .txt-bad { color: var(--bad); font-size: 13px; }
  .linha-os { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .laudo-card { cursor: pointer; } .laudo-card:hover { border-color: var(--pri); } .laudo-card .tit { font-weight: 700; font-size: 16px; margin-top: 8px; }
  .item-ed { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; cursor: pointer; background: var(--gray-2); }
  .item-ed:hover { border-color: var(--pri); }
  .cab-laudo { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .progresso { display: flex; align-items: center; gap: 10px; margin: 10px 0 2px; font-size: 13px; color: var(--muted); } .progresso .barra { flex: 1; margin: 0; }
  details.bloco { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; padding: 0 12px 12px; }

  .item-tx { font-size: 15px; line-height: 1.35; margin-bottom: 8px; } .cod { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); font-weight: 700; }
  .resp { display: flex; gap: 8px; align-items: center; }

  .resp button.r-C.sel { background: var(--ok); border-color: var(--ok); color: #04170d; } .resp button.r-NC.sel { background: var(--bad); border-color: var(--bad); color: #250604; } .resp button.r-NA.sel { background: #4b5263; border-color: #4b5263; color: #fff; }
  .resp button:disabled { opacity: .7; cursor: default; }
  .foto-bt { min-width: 52px; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--pri-2); color: var(--pri); display: inline-flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; margin: 0; }

  .item textarea { margin-top: 8px; } .link-obs { background: none; border: none; color: var(--muted); font-size: 13px; padding: 6px 0 0; cursor: pointer; }

  // ----- Fotos -----
  function reduzir(file, max, q) {
    return new Promise(function (ok, erro) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () { var k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', q)); };
      img.onerror = function () { URL.revokeObjectURL(url); erro(new Error('imagem')); };
      img.src = url;
    });
  }
  async function enviarFotos(l, files, codigo) {
    if (!files.length) return;
    var leg = codigo ? (l.checklist.find(function (i) { return i.codigo === codigo; }) || {}).texto || '' : '';
    for (var i = 0; i < files.length; i++) {
      toast('Enviando foto ' + (i + 1) + '/' + files.length + '…');
      try {
        var full = await reduzir(files[i], 1400, .72), th = await reduzir(files[i], 220, .6);
        var fid = await banco.criar(SPDA.COLECOES.fotos, SPDA.novaFoto(l.id, codigo, full, ''));
        var ref = { id: fid, thumb: th, legenda: '' };
        if (codigo) { var it = l.checklist.find(function (x) { return x.codigo === codigo; }); it.fotos = (it.fotos || []).concat([ref]); await gravarLaudo(l, { checklist: l.checklist }); }
        else await gravarLaudo(l, { fotosGerais: (l.fotosGerais || []).concat([ref]) });
      } catch (e) { toast('Não foi possível enviar a foto ' + files[i].name); }
    }
    toast(plural(files.length, 'foto salva', 'fotos salvas') + (navigator.onLine ? '.' : ' no aparelho (vai subir quando a internet voltar).'));
    render();
  }
