<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronos · Ideal LESP</title>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1d2433; --muted: #667085; --line: #e3e7ee;
    --pri: #0b5cad; --pri-2: #e8f1fb; --ok: #16794c; --ok-2: #e6f4ec; --warn: #9a6400; --warn-2: #fdf3df;
    --bad: #b42318; --bad-2: #fdecea; --gray-2: #eef0f4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --card: #1b2029; --text: #e7eaf0; --muted: #9aa3b2; --line: #2b3240;
      --pri: #5aa2ec; --pri-2: #1c2c40; --ok: #4cc38a; --ok-2: #173326; --warn: #e3b04b; --warn-2: #3a2e15;
      --bad: #f07a6f; --bad-2: #3d1d1b; --gray-2: #252b36;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }
  header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; max-width: 1200px; margin: 0 auto; gap: 12px; }
  .marca { font-weight: 700; font-size: 18px; letter-spacing: .3px; }
  .marca small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .usuario { color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
  nav { display: flex; gap: 4px; overflow-x: auto; padding: 0 16px; max-width: 1200px; margin: 0 auto; }
  nav button { background: none; border: none; border-bottom: 3px solid transparent; padding: 10px 12px; color: var(--muted); font-size: 15px; cursor: pointer; white-space: nowrap; }
  nav button.ativo { color: var(--pri); border-bottom-color: var(--pri); font-weight: 600; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .view { display: none; } .view.ativa { display: block; }
  h2 { font-size: 20px; margin: 4px 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .kpi .rotulo { color: var(--muted); font-size: 13px; }
  .kpi .valor { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .kpi .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .kpi { cursor: pointer; }
  .funil { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
  .funil .etapa { flex: 1 1 140px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; cursor: pointer; }
  .funil .etapa b { display: block; font-size: 22px; }
  .funil .etapa span { color: var(--muted); font-size: 13px; }
  .funil .seta { align-self: center; color: var(--muted); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  .linha { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0 12px; }
  .btn { background: var(--pri); color: #fff; border: none; border-radius: 8px; padding: 9px 14px; font: inherit; cursor: pointer; }
  .btn.sec { background: var(--gray-2); color: var(--text); }
  .btn.perigo { background: var(--bad-2); color: var(--bad); }
  .btn.ok { background: var(--ok); }
  .btn.peq { padding: 6px 10px; font-size: 13px; }
  .acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .busca { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .busca input, .busca select { flex: 1 1 200px; width: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.clicavel { cursor: pointer; } tr.clicavel:hover td { background: var(--pri-2); }
  .tabela { overflow-x: auto; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .t-gray { background: var(--gray-2); color: var(--muted); } .t-blue { background: var(--pri-2); color: var(--pri); }
  .t-ok { background: var(--ok-2); color: var(--ok); } .t-warn { background: var(--warn-2); color: var(--warn); } .t-bad { background: var(--bad-2); color: var(--bad); }
  .muted { color: var(--muted); font-size: 13px; }
  .vazio { text-align: center; color: var(--muted); padding: 24px; }
  .itens td input { padding: 6px 8px; }
  .total { text-align: right; font-size: 18px; font-weight: 700; margin-top: 10px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #1d2433; color: #fff; padding: 10px 16px; border-radius: 8px; display: none; z-index: 100; max-width: 90vw; }
  .aviso { background: var(--warn-2); color: var(--warn); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
  .modal-fundo { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-start; justify-content: center; z-index: 50; overflow-y: auto; padding: 24px 12px; }
  .modal-fundo.aberto { display: flex; }
  .modal { background: var(--card); border-radius: 12px; width: 100%; max-width: 760px; padding: 18px; }
  .modal h3 { margin: 0 0 8px; }
  .detalhe dt { color: var(--muted); font-size: 12px; margin-top: 8px; } .detalhe dd { margin: 2px 0 0; }
  .ciclo { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  #tela-login { max-width: 380px; margin: 60px auto; }
  #print { display: none; }
  .ou { display: flex; align-items: center; gap: 10px; margin: 14px 0 10px; color: var(--muted, #6b7785); font-size: 13px; }
  .ou::before, .ou::after { content: ''; flex: 1; border-top: 1px solid #dde2e7; }
  .btn-google { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
  @media (max-width: 520px) { #usuario-nome { display: none; } .marca small { display: none; } }
  @media print {
    body { background: #fff; color: #000; }
    header, main, #toast, .modal-fundo { display: none !important; }
    #print { display: block; font-size: 12pt; }
    #print table th, #print table td { border-bottom: 1px solid #ccc; color: #000; }
    @page { margin: 12mm 14mm 6mm; }
    .pp-tab { width: 100%; border-collapse: collapse; }
    .pp-tab > tbody > tr > td, .pp-tab > tfoot > tr > td { border: 0 !important; padding: 0; }
    .pp { font-size: 10.5pt; line-height: 1.4; }
    .pp p { margin: 4px 0; text-align: justify; }
    .pp h4 { margin: 14px 0 4px; font-size: 11pt; break-after: avoid; }
    .pp-topo { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 10px; }
    .pp-marca { font-size: 22pt; letter-spacing: 2px; }
    .pp ol.sub { list-style: none; padding-left: 14px; margin: 4px 0; }
    .pp ol.sub li { margin: 2px 0; text-align: justify; break-inside: avoid; }
    .pp ol.sub span { font-weight: bold; }
    .pp .itens-print { width: 100%; border-collapse: collapse; font-size: 10pt; }
    .pp .itens-print th { text-align: left; border-bottom: 1px solid #000; }
    .pp .itens-print .n { text-align: right; white-space: nowrap; }
    .pp .dados { margin-left: 14px; text-align: left; }
    .pp-assin { display: flex; justify-content: space-around; margin-top: 40px; text-align: center; break-inside: avoid; }
    .pp-rodape { position: fixed; bottom: 0; left: 0; right: 0; text-align: center; font-size: 8pt; color: #333; border-top: 1px solid #999; padding-top: 3px; }
  }
</style>
</head>
<body>

<header id="cabecalho" style="display:none">
  <div class="top">
    <div class="marca">Cronos <small>Idealle</small></div>
    <div class="usuario"><span id="usuario-nome"></span><button class="btn sec peq" id="btn-sair">Sair</button></div>
  </div>
  <nav id="menu">
    <button data-view="painel" class="ativo">Painel</button>
    <button data-view="clientes">Clientes</button>
    <button data-view="propostas">Propostas</button>
    <button data-view="modelos">Modelos</button>
    <button data-view="ordens">Ordens de Serviço</button>
    <button data-view="faturas">Faturamento</button>
  </nav>
</header>

<div id="tela-login" class="card" style="display:none">
  <h2>Cronos</h2>
  <p class="muted">Entre com seu e-mail e senha da Idealle.</p>
  <label>E-mail</label><input id="login-email" type="email" autocomplete="username">
  <label>Senha</label><input id="login-senha" type="password" autocomplete="current-password">
  <div class="acoes"><button class="btn" id="btn-entrar">Entrar</button><button class="btn sec" id="btn-demo">Testar sem banco</button></div>
  <div class="ou"><span>ou</span></div>
  <button class="btn sec btn-google" id="btn-google"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.5 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.3.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg> Entrar com Google</button>
  <p class="muted" id="login-erro"></p>
</div>

<main id="app" style="display:none">
  <div id="aviso-modo" class="aviso" style="display:none"></div>

  <!-- PAINEL -->
  <section class="view ativa" id="v-painel">
    <h2>Painel <button class="btn sec peq" id="btn-importar">Importar planilhas antigas</button></h2>
    <input type="file" id="arquivo-importacao" accept=".json,application/json" style="display:none">
    <div class="funil" id="funil"></div>
    <div class="grid" id="kpis" style="margin-top:12px"></div>
    <div class="card" style="margin-top:12px">
      <b>Precisa de atenção</b>
      <div id="atencao" class="tabela"></div>
    </div>
  </section>

  <!-- CLIENTES -->
  <section class="view" id="v-clientes">
    <h2>Clientes <button class="btn" id="btn-novo-cliente">+ Novo cliente</button></h2>
    <div class="busca"><input id="busca-cliente" placeholder="Buscar por nome, código, CNPJ, cidade…"></div>
    <div id="aviso-codigos"></div>
    <div class="card tabela" id="lista-clientes"></div>
  </section>

  <!-- PROPOSTAS -->
  <section class="view" id="v-propostas">
    <h2>Propostas comerciais <button class="btn" id="btn-nova-proposta">+ Nova proposta</button></h2>
    <div class="busca">
      <input id="busca-proposta" placeholder="Buscar por número, cliente, título…">
      <select id="filtro-proposta"><option value="">Todos os status</option></select>
    </div>
    <div class="card tabela" id="lista-propostas"></div>
  </section>

  <!-- MODELOS DE PROPOSTA -->
  <section class="view" id="v-modelos">
    <h2>Modelos de proposta <button class="btn" id="btn-novo-modelo">+ Novo modelo</button></h2>
    <p class="muted">Textos e preços prontos para começar uma proposta. A faixa mostra o que a Idealle já cobrou nesse tipo de serviço.</p>
    <div id="lista-modelos"></div>
  </section>

  <!-- ORDENS -->
  <section class="view" id="v-ordens">
    <h2>Ordens de Serviço <button class="btn" id="btn-nova-os">+ Nova OS</button></h2>
    <div class="busca">
      <input id="busca-os" placeholder="Buscar por número, cliente, descrição…">
      <select id="filtro-os"><option value="">Todos os status</option></select>
    </div>
    <div class="card tabela" id="lista-ordens"></div>
  </section>

  <!-- FATURAS -->
  <section class="view" id="v-faturas">
    <h2>Faturamento</h2>
    <div class="busca">
      <input id="busca-fatura" placeholder="Buscar por número, cliente, NF…">
      <select id="filtro-fatura"><option value="">Todos os status</option></select>
    </div>
    <div class="card tabela" id="lista-faturas"></div>
  </section>
</main>

<div class="modal-fundo" id="modal-fundo"><div class="modal" id="modal"></div></div>
<div id="print"></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  // ===================== CONFIGURAÇÃO =====================
  // Mesmo banco Firebase da Termografia: clientes (coleção "empresas") e OS (coleção "ordens")
  // ficam compartilhados, então o que você cadastra aqui aparece lá sem digitar de novo.
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyAN72-6pCbPaBowiGA2jciJ_lzB9d6z110",
    authDomain: "idealle-termografia.firebaseapp.com",
    projectId: "idealle-termografia",
    storageBucket: "idealle-termografia.firebasestorage.app",
    messagingSenderId: "577776042104",
    appId: "1:577776042104:web:508a131e13a4ef4afbed8d"
  };
  // Endereço da Termografia (mesmo site: o Cronos fica em /cronos/), para abrir uma OS direto lá.
  var SISTEMAS = {
    'Termografia': '/'
  };
  // Dados impressos nas propostas (cabeçalho, rodapé, faturamento e assinaturas)
  // Quem pode entrar com Google: e-mails ou domínios (ex.: '@ideallesp.com.br'). Lista vazia = qualquer conta Google.
  var ACESSO_GOOGLE = [];
  var EMPRESA = {
    nome: 'IDEALLE', razao: 'Idealle Inspeções e Serviços Ltda', slogan: 'Referência em Inspeções Industriais',
    endereco: 'Rua Três Marias, 22, Sala 221 - Vila Madeirense - Guarulhos-SP - CEP 07110-170', telefone: '(11) 4280-9111',
    site: 'www.ideallesp.com.br', cnpj: '52.743.559/0001-05', ie: '132.266.610.117', pix: '52743559000105', cidade: 'Guarulhos',
    assinaturas: [['Rodrigo Cunha', 'Diretor Comercial'], ['Gilberto Luz', 'Diretor Operacional']]
  };

  // ===================== UTILIDADES =====================
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function agora() { return new Date().toISOString(); }
  function hoje() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  function somarDias(iso, n) { var d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
  function brl(v) { return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function data(iso) { if (!iso) return '—'; var p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
  function num(v) { if (typeof v === 'number') return v; var n = parseFloat(String(v).replace(/\./g, '').replace(',', '.')); return isNaN(n) ? 0 : n; }
  function normal(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function soDigitos(s) { return String(s || '').replace(/\D/g, ''); }
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 3200); }
  function proximoNumero(lista, campo) { var m = 0; lista.forEach(function (x) { var n = parseInt(x[campo], 10); if (!isNaN(n) && n > m) m = n; }); return m + 1; }
  function pad(n, t) { n = String(n); while (n.length < t) n = '0' + n; return n; }

  var STATUS = {
    proposta: { rascunho: ['Rascunho', 't-gray'], enviada: ['Enviada', 't-blue'], aprovada: ['Aprovada', 't-ok'], recusada: ['Recusada', 't-bad'], semretorno: ['Sem retorno', 't-gray'] },
    os: { aberta: ['Aberta', 't-blue'], execucao: ['Em execução', 't-warn'], concluida: ['Concluída', 't-ok'], faturada: ['Faturada', 't-gray'], cancelada: ['Cancelada', 't-bad'] },
    fatura: { pendente: ['A receber', 't-warn'], paga: ['Recebida', 't-ok'], cancelada: ['Cancelada', 't-bad'] }
  };
  function tag(tipo, st, venc) {
    var s = STATUS[tipo][st] || [st || '—', 't-gray'];
    if (tipo === 'fatura' && st === 'pendente' && venc && venc < hoje()) return '<span class="tag t-bad">Vencida</span>';
    return '<span class="tag ' + s[1] + '">' + s[0] + '</span>';
  }
  function statusOS(o) { return o.status || 'aberta'; } // OS criadas na Termografia não têm status: contam como abertas

  // ===================== BANCO DE DADOS =====================
  // Duas implementações com a mesma interface: Firestore (real) e local (modo de teste no navegador).
  var COLECOES = ['empresas', 'propostas', 'ordens', 'faturas', 'modelos'];
  var cache = { empresas: [], propostas: [], ordens: [], faturas: [], modelos: [] };
  var banco = null;

  function bancoFirestore(db) {
    return {
      ouvir: function (col, cb) {
        return db.collection(col).onSnapshot(function (snap) {
          cb(snap.docs.map(function (d) { var x = d.data() || {}; x.id = d.id; return x; }));
        }, function (err) { console.error(err); toast('Erro ao ler ' + col + ': ' + err.message); });
      },
      criar: function (col, doc) { return db.collection(col).add(doc).then(function (r) { return r.id; }); },
      // merge: true preserva campos que outros sistemas (como a Termografia) gravaram no mesmo documento
      atualizar: function (col, id, doc) { return db.collection(col).doc(id).set(doc, { merge: true }); },
      excluir: function (col, id) { return db.collection(col).doc(id).delete(); }
    };
  }

  function bancoLocal() {
    var CH = 'cronos-demo-v1', ouvintes = {}, dados;
    try { dados = JSON.parse(localStorage.getItem(CH) || 'null'); } catch (e) { dados = null; }
    if (!dados) dados = exemplo();
    COLECOES.forEach(function (c) { dados[c] = dados[c] || []; });
    function salvar() { try { localStorage.setItem(CH, JSON.stringify(dados)); } catch (e) {} }
    function avisar(col) { (ouvintes[col] || []).forEach(function (cb) { cb(dados[col].map(function (x) { return Object.assign({}, x); })); }); }
    return {
      ouvir: function (col, cb) { (ouvintes[col] = ouvintes[col] || []).push(cb); setTimeout(function () { avisar(col); }, 0); },
      criar: function (col, doc) { doc = Object.assign({}, doc); doc.id = 'L' + Date.now() + Math.random().toString(36).slice(2, 6); dados[col].push(doc); salvar(); avisar(col); return Promise.resolve(doc.id); },
      atualizar: function (col, id, doc) { var i = dados[col].findIndex(function (x) { return x.id === id; }); if (i >= 0) Object.assign(dados[col][i], doc); salvar(); avisar(col); return Promise.resolve(); },
      excluir: function (col, id) { dados[col] = dados[col].filter(function (x) { return x.id !== id; }); salvar(); avisar(col); return Promise.resolve(); }
    };
  }

  function exemplo() {
    var h = hoje();
    return {
      empresas: [
        { id: 'c1', codigo: 'CLI-0001', nome: 'Metalúrgica Exemplo Ltda', cnpj: '12.345.678/0001-90', contato: 'Carlos', telefone: '(11) 99999-0000', email: 'carlos@exemplo.com.br', cidade: 'São Paulo', uf: 'SP', createdAt: agora() },
        { id: 'c2', codigo: 'CLI-0002', nome: 'Hospital Modelo', cnpj: '98.765.432/0001-10', contato: 'Ana', telefone: '(11) 98888-1111', email: 'manutencao@modelo.org', cidade: 'Campinas', uf: 'SP', createdAt: agora() }
      ],
      propostas: [
        { id: 'p1', numero: 1, ano: 2026, clienteId: 'c1', clienteNome: 'Metalúrgica Exemplo Ltda', titulo: 'Inspeção termográfica dos painéis elétricos', sistema: 'Termografia', itens: [{ descricao: 'Inspeção termográfica (diária)', qtd: 2, valor: 1800 }, { descricao: 'Relatório técnico com laudos', qtd: 1, valor: 600 }], total: 4200, validade: somarDias(h, 15), status: 'enviada', data: h, createdAt: agora() }
      ],
      ordens: [], faturas: [],
      modelos: [

  function formatarCNPJ(d) { return d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5'); }
  // Consulta pública da Receita (BrasilAPI): preenche só os campos que estão vazios
  async function buscarCNPJ(valor) {
    var d = soDigitos(valor), info = $('f-cnpj-info');
    if (d.length !== 14) { info.textContent = ''; return; }
    $('f-cnpj').value = formatarCNPJ(d);
    info.textContent = 'Buscando na Receita…';
    try {
      var r = await fetch('https://brasilapi.com.br/api/cnpj/v1/' + d);
      if (!r.ok) { info.textContent = r.status === 404 ? 'CNPJ não encontrado na Receita.' : 'Consulta indisponível agora; preencha à mão.'; return; }
      var x = await r.json();
      function por(id, v) { if (v && !$(id).value.trim()) $(id).value = v; }
      por('f-nome', x.razao_social);
      por('f-endereco', [x.descricao_tipo_de_logradouro, x.logradouro].filter(Boolean).join(' ') + (x.numero ? ', ' + x.numero : '') + (x.complemento ? ' ' + x.complemento : '') + (x.bairro ? ' - ' + x.bairro : ''));
      por('f-cidade', x.municipio); por('f-uf', x.uf); por('f-cep', x.cep ? String(x.cep).replace(/^(\d{5})(\d{3})$/, '$1-$2') : '');
      por('f-telefone', x.ddd_telefone_1); por('f-email', (x.email || '').toLowerCase());
      info.textContent = (x.razao_social || '') + (x.descricao_situacao_cadastral ? ' · ' + x.descricao_situacao_cadastral : '');
    } catch (e) { info.textContent = 'Consulta indisponível agora; preencha à mão.'; }
  }

  function formCliente(c) {

  function renderPropostas() {
    var q = normal($('busca-proposta').value), st = $('filtro-proposta').value;
    var lista = cache.propostas.filter(function (p) {
      return (!st || p.status === st) && (!q || normal([codProposta(p), nomeCliente(p.clienteId, p.clienteNome), p.titulo].join(' ')).indexOf(q) >= 0);
    }).sort(function (a, b) { return (b.ano - a.ano) || (b.numero - a.numero); });

    function lerItens() {

      '<div class="acoes">' + botoes.join('') + '</div>');
    function ligar(id, fn) { var b = $(id); if (b) b.onclick = fn; }
    ligar('pv-fechar', fecharModal);

    ligar('pv-modelo', function () {

  function extenso(v) {
    var U = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
    var D = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
    var C = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];
    function ate999(n) {
      if (n === 100) return 'cem';
      var c = Math.floor(n / 100), r = n % 100, p = [];
      if (c) p.push(C[c]);
      if (r) p.push(r < 20 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' e ' + U[r % 10] : ''));
      return p.join(' e ');
    }
    function inteiro(n) {
      if (!n) return 'zero';
      var grupos = [['', ''], ['mil', 'mil'], ['milhão', 'milhões'], ['bilhão', 'bilhões']], partes = [], i = 0, ultimo = 0;
      while (n > 0) {
        var g = n % 1000;
        if (g) partes.unshift((i === 1 && g === 1 ? '' : ate999(g)) + (i ? (i === 1 && g === 1 ? '' : ' ') + grupos[i][g > 1 ? 1 : 0] : ''));
        if (i === 0) ultimo = g;
        n = Math.floor(n / 1000); i++;
      }
      // "mil e quinhentos", "dois mil e cinquenta", mas "mil novecentos e cinquenta"
      if (partes.length > 1 && ultimo && (ultimo < 100 || ultimo % 100 === 0)) return partes.slice(0, -1).join(', ') + ' e ' + partes[partes.length - 1];
      return partes.join(' ');
    }
    v = Math.round((Number(v) || 0) * 100);
    var r = Math.floor(v / 100), c = v % 100;
    var txt = inteiro(r) + (r === 1 ? ' real' : (r && r % 1000000 === 0 ? ' de reais' : ' reais'));
    if (c) txt += ' e ' + inteiro(c) + (c === 1 ? ' centavo' : ' centavos');
    return txt.charAt(0).toUpperCase() + txt.slice(1);
  }
  function dataExtenso(iso) {
    var m = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
    var p = String(iso || hoje()).split('-');
    return parseInt(p[2], 10) + ' de ' + m[parseInt(p[1], 10) - 1] + ' de ' + p[0];
  }
  function linhas(t) { return String(t || '').split('\n').map(function (l) { return l.trim(); }).filter(Boolean); }
  function diasEntre(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5); }

      (p.itens || []).filter(function (i) { return num(i.qtd); }).map(function (i, k) { return '<tr><td>2.' + (k + 1) + '</td><td>' + esc(i.descricao) + '</td><td class="n">' + esc(i.qtd) + '</td><td class="n">' + brl(i.valor) + '</td><td class="n">' + brl(num(i.qtd) * num(i.valor)) + '</td></tr>'; }).join('') + '</tbody></table>');
    corpo += secao('LOCAL DE EXECUÇÃO DOS SERVIÇOS', par(p.local || 'Nas instalações do cliente, conforme endereço acima.'));
    if (p.escopo) corpo += secao('ESCOPO DA INSPEÇÃO', '<p>A fim de podermos atender o objetivo do trabalho, propomos a execução dos seguintes itens, os quais serão definidos para cada equipamento inspecionado:</p>' + lista(p.escopo, n + 1) +
      '<p>Todos os prontuários, relatórios e certificados emitidos serão encaminhados no formato digital com armazenamento em nuvem para download.</p>');
    if (p.fornIdealle) corpo += secao('FORNECIMENTO IDEALLE', lista(p.fornIdealle, n + 1));
    if (p.fornCliente) corpo += secao('FORNECIMENTO DO CLIENTE', lista(p.fornCliente, n + 1));

    corpo += secao('PREÇOS E CONDIÇÕES DE FORNECIMENTO', '<p>O valor global para a execução completa dos serviços propostos, relacionados no item 2 desta proposta, é de <b>' + brl(p.total) + '</b> (' + esc(extenso(p.total)) + ').</p>' +
      linhas(p.obsPreco).map(function (l) { return '<p>* ' + esc(l) + '</p>'; }).join(''));
    corpo += secao('CONDIÇÕES DE PAGAMENTO', par(p.condicoes || CONDICOES_PADRAO) +
      '<p>Caso venhamos a ser contratados para os serviços descritos nesta proposta, o faturamento será executado pelo endereço:</p>' +
      '<p class="dados">' + esc(EMPRESA.razao) + '<br>' + esc(EMPRESA.endereco) + '<br>CNPJ nº ' + esc(EMPRESA.cnpj) + ' e I. E. nº ' + esc(EMPRESA.ie) + '<br>PIX CNPJ: ' + esc(EMPRESA.pix) + '</p>');
    corpo += secao('VALIDADE DA PROPOSTA', '<p>Esta proposta é válida por ' + dias + ' dias, a partir da data de sua emissão, após o que estará sujeita a confirmação. ' +
      'Desde já agradecemos a oportunidade de participar desta tomada de preços e permanecemos à sua inteira disposição para quaisquer esclarecimentos que se fizerem necessários.</p>');
    $('print').innerHTML =
      '<div class="pp-rodape">' + esc(EMPRESA.nome) + ' - ' + esc(EMPRESA.slogan) + '<br>' + esc(EMPRESA.endereco) + ' - Tel. ' + esc(EMPRESA.telefone) + '<br>' + esc(EMPRESA.site) + '</div>' +
      // o rodapé fixo se repete em cada página; o tfoot vazio reserva o espaço dele para o texto não passar por baixo

      '<div class="pp-topo"><div><b class="pp-marca">' + esc(EMPRESA.nome) + '</b><div>' + esc(EMPRESA.slogan) + '</div></div><div style="text-align:right"><b>PROPOSTA COMERCIAL</b><div>' + codProposta(p) + '</div></div></div>' +
      '<p style="text-align:right">' + esc(EMPRESA.cidade) + ', ' + dataExtenso(p.data) + '.</p>' +
      '<p>À<br><b>' + esc(c.nome) + '</b>' + (c.cnpj ? '<br>CNPJ ' + esc(c.cnpj) : '') + (c.endereco || c.cidade ? '<br>' + esc([c.endereco, c.cidade, c.uf].filter(Boolean).join(' - ')) : '') + '</p>' +
      (c.contato ? '<p>At.: ' + esc(c.contato) + (c.email ? ' · ' + esc(c.email) : '') + '</p>' : '') +
      '<p><b>REF.:</b> ' + esc(p.ref || ('PROPOSTA PARA A PRESTAÇÃO DE SERVIÇOS DE ' + p.titulo).toUpperCase()) + '</p>' +
      '<p><b>N/REF.:</b> ' + codProposta(p) + '</p>' +
      '<p>Prezados Senhores(as),<br>Atendendo à solicitação de V.S.as, apresentamos nossas melhores condições técnicas e comerciais para a execução do serviço em referência, conforme segue:</p>' +
      corpo +
      '<p style="margin-top:24px">Atenciosamente,</p>' +
      '<div class="pp-assin">' + EMPRESA.assinaturas.map(function (a) { return '<div>______________________________<br><b>' + esc(a[0]) + '</b><br>' + esc(a[1]) + '</div>'; }).join('') + '</div>' +
      '</div></td></tr></tbody></table>';
    window.print();
  }

  // ===================== MODELOS DE PROPOSTA =====================
  // Cada modelo guarda o texto e os itens com preço de um tipo de serviço. Os modelos da Idealle
  // entram pela importação (arquivo privado, fora do GitHub) e podem ser editados aqui.
  function renderModelos() {

  // ===================== PAINEL =====================
  function renderPainel() {
    var h = hoje(), mes = h.slice(0, 7);
    var P = cache.propostas, O = cache.ordens, F = cache.faturas;
    function soma(l, c) { return l.reduce(function (s, x) { return s + num(x[c]); }, 0); }
    var pAbertas = P.filter(function (p) { return p.status === 'rascunho' || p.status === 'enviada'; });
    var oAbertas = O.filter(function (o) { return statusOS(o) === 'aberta'; });
    var oExec = O.filter(function (o) { return statusOS(o) === 'execucao'; });
    var oConcl = O.filter(function (o) { return statusOS(o) === 'concluida'; });
    var fPend = F.filter(function (f) { return f.status === 'pendente'; });
    var fVenc = fPend.filter(function (f) { return f.vencimento && f.vencimento < h; });
    var fMes = F.filter(function (f) { return f.status === 'paga' && String(f.dataPagamento || '').slice(0, 7) === mes; });
    var aprovMes = P.filter(function (p) { return p.status === 'aprovada' && String(p.aprovadaEm || '').slice(0, 7) === mes; });
    var decididas = P.filter(function (p) { return ['aprovada', 'recusada', 'semretorno'].indexOf(p.status) >= 0; });
    var taxa = decididas.length ? Math.round(100 * P.filter(function (p) { return p.status === 'aprovada'; }).length / decididas.length) : null;

    var etapas = [
      ['Propostas em aberto', pAbertas.length, brl(soma(pAbertas, 'total')), 'propostas', ''],
      ['OS abertas', oAbertas.length, '', 'ordens', 'aberta'],
      ['Em execução', oExec.length, '', 'ordens', 'execucao'],
      ['A faturar', oConcl.length, brl(soma(oConcl, 'valor')), 'ordens', 'concluida'],
      ['A receber', fPend.length, brl(soma(fPend, 'valor')), 'faturas', 'pendente']
    ];
    $('funil').innerHTML = etapas.map(function (e, i) {
      return (i ? '<div class="seta">›</div>' : '') + '<div class="etapa" data-ir="' + e[3] + '" data-filtro="' + e[4] + '"><b>' + e[1] + '</b><span>' + e[0] + '</span>' + (e[2] ? '<div class="muted">' + e[2] + '</div>' : '') + '</div>';
    }).join('');
    $('kpis').innerHTML = [
      ['Recebido no mês', brl(soma(fMes, 'valor')), fMes.length + ' fatura(s)', 'faturas', 'paga'],
      ['Vencido', brl(soma(fVenc, 'valor')), fVenc.length + ' fatura(s) em atraso', 'faturas', 'pendente'],
      ['Aprovado no mês', brl(soma(aprovMes, 'total')), aprovMes.length + ' proposta(s)', 'propostas', 'aprovada'],
      ['Taxa de aprovação', taxa == null ? '—' : taxa + '%', decididas.length + ' proposta(s) decididas', 'propostas', ''],
      ['Clientes', cache.empresas.length, 'cadastro único', 'clientes', '']
    ].map(function (k) { return '<div class="card kpi" data-ir="' + k[3] + '" data-filtro="' + k[4] + '"><div class="rotulo">' + k[0] + '</div><div class="valor">' + k[1] + '</div><div class="sub">' + k[2] + '</div></div>'; }).join('');

    var at = [];
    fVenc.forEach(function (f) { at.push([f.vencimento, 'Fatura ' + codFatura(f) + ' vencida em ' + data(f.vencimento), nomeCliente(f.clienteId, f.clienteNome), brl(f.valor)]); });
    O.filter(function (o) { return o.prazo && o.prazo < h && ['aberta', 'execucao'].indexOf(statusOS(o)) >= 0; }).forEach(function (o) { at.push([o.prazo, codOS(o) + ' com prazo vencido em ' + data(o.prazo), nomeCliente(o.empresaId, o.empresaNome), '']); });
    oConcl.forEach(function (o) { at.push([o.dataConclusao || h, codOS(o) + ' concluída, falta faturar', nomeCliente(o.empresaId, o.empresaNome), o.valor != null ? brl(o.valor) : '']); });
    P.filter(function (p) { return p.status === 'enviada' && p.validade && p.validade < h; }).forEach(function (p) { at.push([p.validade, 'Proposta ' + codProposta(p) + ' vencida sem resposta', nomeCliente(p.clienteId, p.clienteNome), brl(p.total)]); });
    at.sort(function (a, b) { return a[0] < b[0] ? -1 : 1; });
    $('atencao').innerHTML = at.length ? '<table><tbody>' + at.map(function (a) { return '<tr><td>' + esc(a[1]) + '</td><td>' + esc(a[2]) + '</td><td class="num">' + a[3] + '</td></tr>'; }).join('') + '</tbody></table>' : '<div class="vazio">Tudo em dia.</div>';
  }
  $('v-painel').addEventListener('click', function (e) {
    var el = e.target.closest('[data-ir]'); if (!el) return;
    var v = el.dataset.ir, f = el.dataset.filtro;
    var sel = { propostas: 'filtro-proposta', ordens: 'filtro-os', faturas: 'filtro-fatura' }[v];
    if (sel) $(sel).value = f || '';
    renderTudo(); mostrar(v);
  });

  // ===================== IMPORTAÇÃO DAS PLANILHAS ANTIGAS =====================
  // Lê o arquivo gerado a partir da planilha de OS, das notas fiscais e da lista de contatos.
  // Nada é gravado antes de você conferir o resumo e clicar em Importar; o que já existe não é duplicado.
  $('btn-importar').addEventListener('click', function () { $('arquivo-importacao').value = ''; $('arquivo-importacao').click(); });
  $('arquivo-importacao').addEventListener('change', function () {
    var arq = this.files[0]; if (!arq) return;
    var leitor = new FileReader();
    leitor.onload = function () {
      var d; try { d = JSON.parse(leitor.result); } catch (e) { toast('Arquivo inválido.'); return; }
      if (!(d.clientes && d.propostas && d.ordens && d.faturas) && !d.modelos) { toast('Este arquivo não é uma importação do Cronos.'); return; }
      ['clientes', 'propostas', 'ordens', 'faturas', 'modelos', 'avisos'].forEach(function (k) { d[k] = d[k] || []; });
      conferirImportacao(d);
    };
    leitor.readAsText(arq, 'utf-8');
  });

  function conferirImportacao(d) {
    function cont(l, tipo) { var c = {}; l.forEach(function (x) { c[x.status] = (c[x.status] || 0) + 1; }); return Object.keys(c).map(function (k) { return c[k] + ' ' + ((STATUS[tipo][k] || [k])[0]).toLowerCase(); }).join(', '); }
    function soma(l, campo) { return l.reduce(function (s, x) { return s + num(x[campo]); }, 0); }
    var unidos = d.clientes.filter(function (c) { return (c.grafiasAntigas || []).length > 1; });
    abrirModal('<h3>Importar planilhas antigas</h3><p class="muted">' + esc(d.fonte || '') + '</p>' +
      '<div class="tabela"><table><tbody>' +
      '<tr><td>Clientes</td><td class="num">' + d.clientes.length + '</td><td class="muted">' + unidos.length + ' com grafias diferentes unificadas</td></tr>' +
      '<tr><td>Propostas</td><td class="num">' + d.propostas.length + '</td><td class="muted">' + cont(d.propostas, 'proposta') + ' · ' + brl(soma(d.propostas, 'total')) + '</td></tr>' +
      '<tr><td>Ordens de Serviço</td><td class="num">' + d.ordens.length + '</td><td class="muted">' + cont(d.ordens, 'os') + ' · ' + brl(soma(d.ordens, 'valor')) + '</td></tr>' +
      '<tr><td>Notas fiscais</td><td class="num">' + d.faturas.length + '</td><td class="muted">' + cont(d.faturas, 'fatura') + '</td></tr>' +
      '<tr><td>Modelos de proposta</td><td class="num">' + d.modelos.length + '</td><td class="muted">' + esc(d.modelos.map(function (m) { return m.nome; }).join(' · ')) + '</td></tr>' +
      '</tbody></table></div>' +
      (d.faturas.length ? '<label><input type="checkbox" id="imp-presumir" checked style="width:auto"> A planilha de notas não registra o recebimento. Considerar recebidas as notas com vencimento até</label>' +
      '<input type="date" id="imp-corte" value="' + somarDias(hoje(), -30) + '" style="max-width:200px">' : '') +
      '<details style="margin-top:10px"><summary>Ver clientes unificados (' + unidos.length + ')</summary><div class="muted">' +
      unidos.map(function (c) { return '<div><b>' + esc(c.nome) + '</b> ← ' + esc(c.grafiasAntigas.join(' · ')) + '</div>'; }).join('') + '</div></details>' +
      ((d.avisos || []).length ? '<details><summary>Avisos (' + d.avisos.length + ')</summary><div class="muted">' + d.avisos.map(function (a) { return '<div>' + esc(a) + '</div>'; }).join('') + '</div></details>' : '') +
      '<p id="imp-progresso" class="muted"></p>' +
      '<div class="acoes"><button class="btn ok" id="imp-ok">Importar</button><button class="btn sec" id="imp-cancelar">Cancelar</button></div>');
    $('imp-cancelar').onclick = fecharModal;
    $('imp-ok').onclick = async function () {
      var corte = $('imp-presumir') && $('imp-presumir').checked ? $('imp-corte').value : '';
      this.disabled = true; $('imp-cancelar').disabled = true;
      importando = true;
      try {
        var r = await executarImportacao(d, corte, function (msg) { $('imp-progresso').textContent = msg; });
        $('imp-progresso').textContent = 'Concluído: ' + r;
        toast('Importação concluída.');
      } catch (e) { console.error(e); $('imp-progresso').textContent = 'A importação parou: ' + (e.message || e) + '. Pode rodar de novo: o que já entrou não é duplicado.'; }
      importando = false; renderTudo();
      $('imp-cancelar').disabled = false; $('imp-cancelar').textContent = 'Fechar';
    };
  }

  async function emLotes(lista, fn, aviso, rotulo) {
    for (var i = 0; i < lista.length; i += 20) {
      await Promise.all(lista.slice(i, i + 20).map(fn));
      aviso(rotulo + ': ' + Math.min(i + 20, lista.length) + ' de ' + lista.length);
    }
  }

  async function executarImportacao(d, corte, aviso) {
    var criados = { clientes: 0, propostas: 0, ordens: 0, faturas: 0, modelos: 0 };
    function chaveID(n, ano, cid) { return n + '/' + ano + '|' + cid; }

    // Clientes: reaproveita quem já existe (inclusive os cadastrados pela Termografia)
    var porNome = {};
    cache.empresas.forEach(function (c) { porNome[normal(c.nome)] = c; });
    var codN = parseInt(proximoCodigoCliente().replace(/\D/g, ''), 10) - 1;
    var idCliente = {};
    await emLotes(d.clientes, async function (c) {
      var ex = porNome[normal(c.nome)] || (c.grafiasAntigas || []).map(function (g) { return porNome[normal(g)]; }).filter(Boolean)[0];
      if (ex) {
        var upd = { contatos: c.contatos || [], updatedAt: agora() };
        ['contato', 'email', 'telefone'].forEach(function (k) { if (!ex[k] && c[k]) upd[k] = c[k]; });
        if (!ex.codigo) upd.codigo = 'CLI-' + pad(++codN, 4);
        await banco.atualizar('empresas', ex.id, upd);
        idCliente[c.nome] = ex.id;
      } else {
        var doc = { nome: c.nome, codigo: 'CLI-' + pad(++codN, 4), contato: c.contato || '', email: c.email || '', telefone: c.telefone || '', contatos: c.contatos || [], origem: 'planilha', createdAt: agora(), updatedAt: agora() };
        idCliente[c.nome] = await banco.criar('empresas', doc); criados.clientes++;
      }
    }, aviso, 'Clientes');

    // Propostas
    var propExist = {};
    cache.propostas.forEach(function (p) { propExist[chaveID(p.numero, p.ano, p.clienteId) + '|' + normal(p.titulo)] = p.id; });
    var propPorID = {};
    await emLotes(d.propostas, async function (p) {
      var cid = idCliente[p.clienteNome]; if (!cid) return;
      var k = chaveID(p.numero, p.ano, cid) + '|' + normal(p.titulo);
      var id = propExist[k];
      if (!id) {
        var doc = Object.assign({}, p, { clienteId: cid, sistema: /termogra/i.test(p.titulo) ? 'Termografia' : '', createdAt: agora(), updatedAt: agora() });
        if (doc.status === 'aprovada') doc.aprovadaEm = doc.data || '';
        id = await banco.criar('propostas', doc); criados.propostas++;
      }
      propPorID[chaveID(p.numero, p.ano, cid)] = { id: id, p: p };
    }, aviso, 'Propostas');

    // Ordens de Serviço
    var osExist = {};
    cache.ordens.forEach(function (o) { if (o.codigo) osExist[o.codigo + '|' + o.empresaId] = o.id; });
    var osPorID = {}, osPorNumero = {};
    await emLotes(d.ordens, async function (o) {
      var cid = idCliente[o.empresaNome]; if (!cid) return;
      var pr = propPorID[chaveID(o.numero, o.ano, cid)];
      var id = osExist[o.codigo + '|' + cid];
      if (!id) {
        var doc = { numero: o.numero, codigo: o.codigo, empresaId: cid, empresaNome: o.empresaNome, descricao: o.descricao, valor: o.valor, pedido: o.pedido || '',
          dataAbertura: (pr && pr.p.data) || o.dataFaturamentoPrevista || '', previsaoRecebimento: o.previsaoRecebimento || '', condicoes: o.condicoes || '',
          obs: o.obs || '', status: o.status, propostaId: pr ? pr.id : '', propostaCodigo: o.codigo, origem: 'planilha', createdAt: agora() };
        if (o.status === 'faturada') doc.dataConclusao = o.dataFaturamentoPrevista || '';
        id = await banco.criar('ordens', doc); criados.ordens++;
        if (pr) await banco.atualizar('propostas', pr.id, { osId: id, status: 'aprovada' });
      }
      osPorID[chaveID(o.numero, o.ano, cid)] = id;
      osPorNumero[o.numero + '/' + o.ano] = osPorNumero[o.numero + '/' + o.ano] || { id: id, o: o };
    }, aviso, 'Ordens de Serviço');

    // Notas fiscais
    var nfExist = {};
    cache.faturas.forEach(function (f) { if (f.nf) nfExist[f.nf] = true; });
    var seq = proximoNumero(cache.faturas, 'numero');
    await emLotes(d.faturas, async function (f) {
      if (nfExist[f.nf]) return;
      var cid = idCliente[f.clienteNome];
      var osId = osPorID[chaveID(f.osNumero, f.osAno, cid)] || (osPorNumero[f.osNumero + '/' + f.osAno] || {}).id || '';
      var ref = f.vencimento || f.emissao || '';
      var paga = f.status === 'pendente' && corte && ref && ref <= corte;
      var doc = { numero: seq++, nf: f.nf, clienteId: cid || '', clienteNome: f.clienteNome, osId: osId, osNumero: f.osNumero, osCodigo: f.osCodigo,
        descricao: (osPorNumero[f.osNumero + '/' + f.osAno] || { o: {} }).o.descricao || '', pedido: f.pedido || '', valor: f.valor, emissao: f.emissao || '',
        vencimento: f.vencimento || '', prazo: f.prazo || '', status: paga ? 'paga' : f.status, origem: 'planilha', createdAt: agora() };
      if (paga) { doc.dataPagamento = ref; doc.recebimentoPresumido = true; }
      var fid = await banco.criar('faturas', doc); criados.faturas++;
      if (osId) await banco.atualizar('ordens', osId, { faturaId: fid });
    }, aviso, 'Notas fiscais');

    // Modelos de proposta: os que já vieram de uma importação anterior (mesma chave) não são sobrescritos,
    // para não desfazer ajustes feitos aqui no Cronos
    var modExist = {};
    cache.modelos.forEach(function (m) { if (m.chave) modExist[m.chave] = true; });
    await emLotes(d.modelos, async function (m) {
      if (m.chave && modExist[m.chave]) return;
      await banco.criar('modelos', Object.assign({}, m, { createdAt: agora(), updatedAt: agora() })); criados.modelos++;
    }, aviso, 'Modelos');

    return criados.clientes + ' clientes, ' + criados.propostas + ' propostas, ' + criados.ordens + ' OS, ' + criados.faturas + ' notas e ' + criados.modelos + ' modelos criados.';
  }

  function renderTudo() { renderPainel(); renderClientes(); renderPropostas(); renderModelos(); renderOrdens(); renderFaturas(); }
})();
</script>
